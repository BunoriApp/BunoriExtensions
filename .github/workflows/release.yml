name: Release & Extension Repository Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      compile_all:
        description: "Force compile and release ALL extensions"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Calculated release tag: $TAG (commit $SHORT_SHA on main branch)"

      - name: Set up Rust & WebAssembly Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache WAMR Compiler
        id: cache-wamr
        uses: actions/cache@v4
        with:
          path: wamr/
          key: wamrc-2.4.3

      - name: Download WAMR Compiler
        if: steps.cache-wamr.outputs.cache-hit != 'true'
        run: |
          mkdir -p wamr
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/toolchain-v2.4.3/wamrc-linux-x86_64-v2.4.3.tar.gz | tar -xz -C wamr/
          chmod +x wamr/wamrc-2.4.3
          
      - name: Build & Package Extensions
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILE_ALL: ${{ inputs.compile_all || contains(github.event.head_commit.message, '[compile-all]') }}
        run: |
          EXTRA_FLAGS=""
          if [ "$COMPILE_ALL" = "true" ]; then
            echo "Forcing compilation of ALL extensions!"
            EXTRA_FLAGS="--compile-all"
          fi
          python3 tools/package_extensions.py --bext-dir dist --out-dir repo $EXTRA_FLAGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.bext
            repo/
          retention-days: 30

      - name: Check for releasable changes
        id: gate
        run: |
          HAS_RELEASE=$(cat repo/has_release.txt 2>/dev/null || echo "false")
          echo "release=$HAS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release required: $HAS_RELEASE"

      - name: Create GitHub Release with .bext Assets
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing GitHub Release $TAG..."

          # Create release if it does not already exist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Bunori Extensions $TAG" \
              --generate-notes
          fi

          # Upload each .bext asset sequentially with retry
          for file in dist/*.bext; do
            [ -e "$file" ] || continue
            echo "Uploading $file to release $TAG..."
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded=true
                echo "Successfully uploaded $file"
                break
              fi
              echo "Upload of $file failed (attempt $attempt/3), retrying in 3s..."
              sleep 3
            done

            if [ "$uploaded" != "true" ]; then
              echo "Error: Failed to upload $file to release $TAG after 3 attempts."
              exit 1
            fi
          done

      - name: Deploy index to repository branch (repo)
        if: steps.gate.outputs.release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
          force_orphan: true
          commit_message: "deploy: Bunori extensions index update [skip ci]"
