name: CI & Extension Repository Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust & WebAssembly Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Package Extensions
        env:
          RELEASE_TAG: v${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/package_extensions.py --bext-dir dist --out-dir repo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions-v${{ github.run_number }}
          path: |
            dist/*.bext
            repo/
          retention-days: 30

      - name: Check for releasable changes
        id: gate
        run: |
          HAS_RELEASE=$(cat repo/has_release.txt 2>/dev/null || echo "false")
          echo "release=$HAS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release required: $HAS_RELEASE"

      - name: Create GitHub Release with .bext Assets
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Bunori Extensions v${{ github.run_number }}"
          files: dist/*.bext
          generate_release_notes: true

      - name: Deploy index to repository branch (repo)
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.gate.outputs.release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
          force_orphan: true
          commit_message: "deploy: Bunori extensions index update [skip ci]"
