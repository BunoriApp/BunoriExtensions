name: CI Verification

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Extensions
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            DIFF_FILES=$(git diff --name-only "$BASE"...HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files in PR / commit:"
          echo "$DIFF_FILES"

          if echo "$DIFF_FILES" | grep -qE '^(sdk/|tools/|Cargo\.toml|Cargo\.lock|\.github/)'; then
            echo "Shared infrastructure changed. Full verification required."
            echo "compile_all=true" >> "$GITHUB_OUTPUT"
            echo "changed_exts=" >> "$GITHUB_OUTPUT"
          else
            EXTS=$(echo "$DIFF_FILES" | grep -E '^sources/' | cut -d'/' -f2 | sort -u | paste -sd, -)
            echo "compile_all=false" >> "$GITHUB_OUTPUT"
            echo "changed_exts=$EXTS" >> "$GITHUB_OUTPUT"
            echo "Changed extensions: ${EXTS:-none}"
          fi

      - name: Set up Rust & WebAssembly Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache WAMR Compiler
        id: cache-wamr
        uses: actions/cache@v4
        with:
          path: wamr/
          key: wamrc-2.4.3

      - name: Download WAMR Compiler
        if: steps.cache-wamr.outputs.cache-hit != 'true'
        run: |
          mkdir -p wamr
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/toolchain-v2.4.3/wamrc-linux-x86_64-v2.4.3.tar.gz | tar -xz -C wamr/
          chmod +x wamr/wamrc-2.4.3

      - name: Workspace Compilation Check
        run: cargo check --target wasm32-unknown-unknown --workspace

      - name: Build & Package Extensions (Dry Run)
        run: |
          if [ "${{ steps.changes.outputs.compile_all }}" = "true" ]; then
            echo "⚡ Compiling and verifying ALL extensions..."
            python3 tools/package_extensions.py \
              --compile-all \
              --no-remote-baseline \
              --bext-dir /tmp/bext \
              --out-dir /tmp/repo
          elif [ -n "${{ steps.changes.outputs.changed_exts }}" ]; then
            echo "⚡ Compiling and verifying changed extension(s): ${{ steps.changes.outputs.changed_exts }}..."
            python3 tools/package_extensions.py \
              --compile-all \
              --include "${{ steps.changes.outputs.changed_exts }}" \
              --no-remote-baseline \
              --bext-dir /tmp/bext \
              --out-dir /tmp/repo
          else
            echo "✓ No extension code modified. Skipping packaging dry run."
          fi
