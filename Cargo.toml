[workspace]
resolver = "2"
members = [
    "sdk",
    "sources/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bunori-sdk = { path = "sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = { version = "0.20", default-features = false }
regex = "1.10"
getrandom = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
